<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cartão de Jogador</title>

  <!-- Font Awesome (mantido para outros casos, mesmo que não usado nos ícones principais) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../../css/cards.css">
</head>
<body>
  <div class="card-wrapper" id="card-wrapper">
    <div class="player-card" id="card">

      <!-- ✅ Controles do card -->
      <div class="card-controls">
        <button class="share-button" id="btn-share" title="Salvar Cartão">
          <i class="fas fa-floppy-disk"></i>
        </button>
        <button class="close-button" id="btn-close" title="Fechar Cartão">
          <i class="fas fa-times"></i>
        </button>

      </div>

      <!-- 📸 Foto -->
      <div class="photo">
        <img id="player-photo" src="" alt="Foto do Jogador">
      </div>

      <!-- 💎 Nome -->
      <div class="player-name" id="player-name">Carregando...</div>

      <!-- 📊 Estatísticas -->
      <div class="stats">
        <div class="stat-row">
          <div class="stat-label"><span data-label="posicao-label">🏅 POSIÇÃO</span></div>
          <div id="posicao">-</div>
        </div>
        <div class="stat-row">
          <div class="stat-label"><span data-label="gols-label">⚽ GOLS</span></div>
          <div id="gols">-</div>
        </div>
        <div class="stat-row">
          <div class="stat-label"><span data-label="vitorias-label">🏆 VITÓRIAS</span></div>
          <div id="vitorias">-</div>
        </div>
      </div>

      <!-- 🔵 Histórico de partidas -->
      <div id="history" class="history-container">
        <!-- Bolinhas via JS -->
      </div>
    </div>
  </div>

  <!-- dom-to-image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  
  <!-- JS principal -->
  <script src="../../js/cards.js" defer></script>
</body>
</html>
