<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loja de GPs</title>
  <link rel="stylesheet" href="/css/menu.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="stylesheet" href="/css/loja.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- ⏳ Regra: oculta conteúdo até menu carregar -->
<!-- ⏳ Regra: oculta conteúdo até menu carregar -->
<style>
  body:not(.menu-ready) main.loja-page {
    opacity: 0;
    pointer-events: none;
  }

  body.menu-ready main.loja-page {
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.4s ease-in-out;
  }
</style>

</head>
<body>
  <!-- 🔽 Menu carregado dinamicamente -->
  <div id="menu-placeholder"></div>

  <!-- 🔒 Conteúdo principal só aparece após menu -->
  <main class="loja-page">
    <!-- 💰 SALDO ATUAL DO USUÁRIO -->
    <section class="saldo-section">
      <h1><i class="fas fa-coins"></i> Saldo Atual</h1>
      <div id="gp-saldo">Carregando...</div>
    </section>

    <!-- 💳 COMPRA DE GPs -->
    <section class="depositar-section">
      <h2><i class="fas fa-credit-card"></i> Depositar GPs</h2>
      <div class="pacotes">
        <!-- 🆕 Pacote 1 -->
        <button onclick="comprarGP(150)">
          150 GPs
        </button>

        <!-- 🆕 Pacote 2 -->
        <button onclick="comprarGP(300)">
          300 GPs
        </button>

        <!-- 🆕 Pacote 3 -->
        <button onclick="comprarGP(500)">
          500 GPs
        </button>
      </div>
    </section>
  </main>

  <!-- 📦 SCRIPTS -->
  <script src="/js/menu.js" defer></script>
  <script src="/js/loja.js" defer></script>

  <!-- 🚫 Fallback se JS estiver desativado -->
  <noscript>
    <style>
      main { display: none; }
    </style>
    <div class="no-js-warning">
      ⚠️ Este site requer JavaScript para funcionar corretamente.
    </div>
  </noscript>
</body>
</html>
