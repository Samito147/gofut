<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loja de GPs</title>
  <link rel="stylesheet" href="/css/menu.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="stylesheet" href="/css/loja.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- ⏳ Regra: oculta conteúdo até menu carregar -->

</head>
<body>
  <!-- 🔽 Menu carregado dinamicamente -->
  <div id="menu-placeholder"></div>
<!-- 🔲 Fundo escurecido -->
<div id="gp-info-overlay" onclick="fecharInfoGP()"></div>
  <!-- 🔒 Conteúdo principal só aparece após menu -->
  <main class="loja-page">
    <!-- 💰 SALDO ATUAL DO USUÁRIO -->
    <section class="saldo-section" style="position: relative;" id="gp-card">
      <h1><i class="fas fa-coins"></i> Saldo Atual</h1>
      <!-- ✅ Ícone no canto superior direito -->
      <button class="info-btn" onclick="abrirInfoGP()" title="Sobre os GPs">
        <i class="fas fa-circle-info"></i>
      </button>
      <div id="gp-saldo">Carregando...</div>
    </section>

    <!-- 💳 COMPRA DE GPs -->
    <section class="depositar-section">
      <h2><i class="fas fa-credit-card"></i> Depositar GPs</h2>
      <div class="pacotes">
        <button onclick="comprarGP(150)">150 GPs</button>
        <button onclick="comprarGP(300)">300 GPs</button>
        <button onclick="comprarGP(500)">500 GPs</button>
      </div>
    </section>
  </main>

  <!-- 🔳 CARD FLUTUANTE COM CONTEÚDO DE GPS.html -->
  <div id="gp-info-card">
    <button id="gp-info-close" onclick="fecharInfoGP()" title="Fechar"><i class="fas fa-times"></i></button>
    <iframe src="gps.html" title="Informações sobre GPs"></iframe>
  </div>

  <!-- 📦 SCRIPTS -->
  <script src="/js/menu.js" defer></script>
  <script src="/js/loja.js" defer></script>
<script>
  // Usa a lógica do loja.js para abrir e fechar corretamente
  function abrirInfoGP() {
    if (typeof abrirModalGP === "function") abrirModalGP();
  }

  function fecharInfoGP() {
    if (typeof fecharModalGP === "function") fecharModalGP();
  }
</script>


  <!-- 🚫 Fallback se JS estiver desativado -->
  <noscript>
    <style> main { display: none; } </style>
    <div class="no-js-warning">
      ⚠️ Este site requer JavaScript para funcionar corretamente.
    </div>
  </noscript>
</body>
</html>
