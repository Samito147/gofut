<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Perfil</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/menu.css"/>
  <link rel="stylesheet" href="css/perfil.css"/>
  <link rel="stylesheet" href="css/historico.css"/>
</head>
<body>
  <div id="menu-placeholder"></div>

  <main class="profile-page">
    <div id="profile-content" style="display: none;">
      <!-- 🧩 Cabeçalho com Avatar + Info lado a lado -->
      <section class="profile-header">
        <div class="avatar-info-wrapper" style="display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; justify-content: center;">
          <div class="avatar">
            <i class="fas fa-user-pen edit-icon" onclick="abrirModal()" title="Alterar Foto de Perfil"></i>
            <img id="profile-avatar" src="/assets/fotos/PADRAO.png" alt="Avatar do Usuário"/>
          </div>
          <div class="info-status-wrapper">
            <div class="personal-info">
              <h1 id="profile-nick">Nick do Usuário</h1>
              <ul>
                <li><i class="fas fa-user"></i> <span id="profile-name">Nome Completo</span></li>
                <li><i class="fas fa-birthday-cake"></i> <span id="profile-age">00 anos</span></li>
              </ul>
            </div>
          </div>
        </div>

        <!-- 🎯 Aproveitamento e bolinhas abaixo -->
        <div class="efficiency-container hide-on-mobile" style="margin-top: 1.5rem;">
          <div class="efficiency-circle">
            <svg>
              <circle class="bg" r="40" cx="50%" cy="50%"></circle>
              <circle class="fg" r="40" cx="50%" cy="50%"></circle>
            </svg>
            <span id="efficiency-text">0%</span>
          </div>
          <div class="match-history" id="match-history"></div>
        </div>
      </section>

      <!-- TABS -->
      <div class="tabs">
        <button type="button" data-tab="stats" class="active">Estatísticas</button>
        <button type="button" data-tab="history">Resultados</button>
        <button type="button" data-tab="achievements">Conquistas</button>
      </div>

      <!-- CONTEÚDO DAS ABAS -->
      <div class="tab-content">
        <!-- Aba Estatísticas -->
        <div id="stats" class="active">
          <section class="stats-grid">
            <div class="stat-card"><i class="fas fa-gamepad"></i><div><h2 id="stat-played">0</h2><p>Partidas</p></div></div>
            <div class="stat-card"><i class="fas fa-futbol"></i><div><h2 id="stat-goals">0</h2><p>Gols</p></div></div>
            <div class="stat-card"><i class="fas fa-trophy"></i><div><h2 id="stat-victories">0</h2><p>Vitórias</p></div></div>
            <div class="stat-card"><i class="fas fa-handshake"></i><div><h2 id="stat-draws">0</h2><p>Empates</p></div></div>
            <div class="stat-card"><i class="fas fa-times-circle"></i><div><h2 id="stat-losses">0</h2><p>Derrotas</p></div></div>
            <div class="stat-card"><i class="fas fa-chart-line"></i><div><h2 id="stat-corners">0.0</h2><p>Escanteios</p></div></div>
            <div class="stat-card"><i class="fas fa-square"></i><div><h2 id="stat-yellow">0</h2><p>Amarelos</p></div></div>
            <div class="stat-card"><i class="fas fa-book-dead"></i><div><h2 id="stat-red">0.0</h2><p>Vermelhos</p></div></div>
            <div class="stat-card"><i class="fas fa-bullseye"></i><div><h2 id="stat-kick-on-target">0</h2><p>Chutes</p></div></div>
            <div class="stat-card"><i class="fas fa-percentage"></i><div><h2 id="stat-possession">0%</h2><p>Posse</p></div></div>
          </section>
        </div>

        <!-- Aba Resultados -->
        <div id="history" class="history-list">
          <div id="results-controls" style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 1rem; flex-wrap:wrap; gap:1rem;">
            <div>
              <label for="results-per-page" style="color:#ccc;">Resultados por página:</label>
              <select id="results-per-page" style="padding: 0.3rem 0.6rem; background-color: #222; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <option value="1">1</option>
                <option value="5">5</option>
                <option value="10">10</option>
              </select>
            </div>
            <div id="pagination-controls" class="pagination-controls" style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
              <!-- Paginação dinâmica -->
              <button id="next-page" data-action="next" title="Próxima Página" style="background: none; border: none; color: #ccc; cursor: pointer; font-size: 1.2rem;">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>

          <!-- 📦 Cards com class="match-entry" serão injetados aqui -->
          <div id="match-results-container">
            <p style="text-align:center; color:#aaa;">Carregando resultados...</p>
          </div>
        </div>

        <!-- Aba Conquistas -->
        <div id="achievements">
          <p style="text-align:center; color:#aaa;">Nenhuma conquista registrada.</p>
        </div>

        <!-- Tabela de Partidas -->
        <div id="matches" class="match-stats-table">
          <div class="table-wrapper">
            <table class="stats-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Resultado</th>
                  <th>Gols</th>
                  <th>Escanteios</th>
                  <th>Cartões</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="stats-table-body">
                <tr><td colspan="6" style="text-align:center;">🔄 Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 🔳 MODAL COM CONFIGS.HTML -->
  <div id="modal-config" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal()">✕</button>
      <iframe src="alterarfoto.html"></iframe>
    </div>
  </div>

  <div id="toast-error" class="toast error"></div>
  <div id="toast-success" class="toast success"></div>

  <script src="js/menu.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.6.2/dist/countUp.umd.js" defer></script>
  <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js" defer></script>
  <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.min.js" defer></script>
  <script src="js/perfil.js" defer></script>
  <script type="module" src="js/historico.js"></script>
</body>
</html>
