<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loja de GPs</title>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="stylesheet" href="/css/menu.css"/>
  <link rel="stylesheet" href="/css/loja.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
  <div id="menu-placeholder"></div>

  <main class="loja-page">
    <section class="saldo-section">
      <h1><i class="fas fa-coins"></i> Saldo Atual</h1>
      <div id="gp-saldo">Carregando...</div>
    </section>

    <section class="depositar-section">
      <h2><i class="fas fa-credit-card"></i> Comprar GPs</h2>
      <div class="pacotes">
        <button onclick="comprarGP(150)">R$7,50 → 150 GPs</button>
      </div>
    </section>

    <section class="mercado-section">
      <h2><i class="fas fa-store"></i> Mercado (em breve)</h2>
      <p>Itens especiais poderão ser comprados aqui usando seus GPs acumulados.</p>
    </section>
  </main>

  <script src="/js/menu.js" defer></script>
  <script src="/js/loja.js" defer></script>

  <noscript>
    <style>
      main { display: none; }
    </style>
    <div class="no-js-warning">
      ⚠️ Este site requer JavaScript para funcionar corretamente.
    </div>
  </noscript>
</body>
</html>
