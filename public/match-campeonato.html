<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partida de Campeonato</title>

  <!-- 🔤 Fonte e Estilo -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/menu.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/match-campeonato.css" />

  <!-- 🎨 FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>

  <!-- 🌑 CSS para controle visual de verificação -->
  <style>
    body.invisible-until-verified {
      visibility: hidden;
    }
    body.visible-after-verification {
      visibility: visible;
      transition: visibility 0.3s ease-in-out;
    }
  </style>
</head>
<body class="invisible-until-verified">

  <!-- 📌 MENU CARREGADO DINAMICAMENTE -->
  <div id="menu-placeholder"></div>
  <script src="js/menu.js" defer></script>

  <!-- 🔔 TOAST FLUTUANTE -->
  <div id="toast" class="toast hidden">Mensagem</div>

  <!-- 🎮 CONTEÚDO PRINCIPAL -->
  <main class="match-campeonato-container profile-page admin-page">
    <form id="matchForm">

      <!-- 🏆 Seletor de Campeonato -->
      <div class="championship-row">

        <!-- 🔁 Botão de reset (ícone sofisticado e discreto) -->
        <div style="width: 100%; display: flex; justify-content: flex-end;">
          <button id="reset-btn" type="button" class="btn-reset"
            title="Resetar Estatísticas do Campeonato"
            style="background: none; border: none; color: #aaa; font-size: 1.2rem; cursor: pointer; margin-bottom: 0.5rem;">
            <i class="fas fa-rotate-left"></i>
          </button>
        </div>

        <!-- 📋 Lista de campeonatos -->
        <div id="campeonatos-lista" class="campeonatos-container"></div>

        <!-- 🔒 Campo oculto para armazenar o campeonato selecionado -->
        <input type="hidden" name="championship_id" id="championship_id" required />
      </div>

      <!-- 🔀 Container Flex dos Jogadores -->
      <div class="players-wrapper">

        <!-- 🧍 Jogador 1 -->
        <div class="player-column">
          <label>Jogador 1:
            <select name="player1" id="player1" required>
              <option value="">Jogador 1</option>
            </select>
          </label>
          <label>Nome do Time:
            <input type="text" name="player1_team" />
          </label>
          <label>Gols:
            <input type="number" name="player1_score" required />
          </label>
          <label>Chutes no Gol:
            <input type="number" name="player1_kick_on_target" min="0" />
          </label>
          <label>Posse de Bola (%):
            <input type="number" name="player1_possession" min="0" max="100" />
          </label>
          <label>Escanteios:
            <input type="number" name="player1_corners" required />
          </label>
          <label>Amarelos:
            <input type="number" name="player1_yellow" required />
          </label>
          <label>Vermelhos:
            <input type="number" name="player1_red" required />
          </label>
        </div>

        <!-- 🧍 Jogador 2 -->
        <div class="player-column">
          <label>Jogador 2:
            <select name="player2" id="player2" required>
              <option value="">Jogador 2</option>
            </select>
          </label>
          <label>Nome do Time:
            <input type="text" name="player2_team" />
          </label>
          <label>Gols:
            <input type="number" name="player2_score" required />
          </label>
          <label>Chutes no Gol:
            <input type="number" name="player2_kick_on_target" min="0" />
          </label>
          <label>Posse de Bola (%):
            <input type="number" name="player2_possession" min="0" max="100" />
          </label>
          <label>Escanteios:
            <input type="number" name="player2_corners" required />
          </label>
          <label>Amarelos:
            <input type="number" name="player2_yellow" required />
          </label>
          <label>Vermelhos:
            <input type="number" name="player2_red" required />
          </label>
        </div>

      </div>

      <!-- ✅ Botão de envio centralizado -->
      <div class="button-wrapper">
        <button type="submit">Enviar Partida</button>
      </div>

    </form>
  </main>

  <!-- 🧠 Scripts -->
  <script src="js/match-campeonato.js" type="module" defer></script>
</body>
</html>
